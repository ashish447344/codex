[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "circle-codex"
version = "0.0.0-dev"
description = "Unofficial Codex Python SDK fork with a built-in xAI provider"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Ashish Verma" }]
keywords = ["codex", "sdk", "llm", "ai", "agents", "xai", "grok"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pydantic>=2.12", "packaging>=26.2", "circle-codex-cli-bin==0.154.0"]

[project.urls]
Homepage = "https://github.com/ashish447344/codex"
Repository = "https://github.com/ashish447344/codex"
Issues = "https://github.com/ashish447344/codex/issues"
Documentation = "https://github.com/ashish447344/codex/tree/main/sdk/python/docs"

[dependency-groups]
format = ["ruff>=0.15.8"]
test = [
  "pytest>=8.0",
  "datamodel-code-generator==0.64.0",
  { include-group = "format" },
]
dev = [
  { include-group = "test" },
  { include-group = "format" },
]

[tool.codex.codegen]
schema-dir = "../../codex-rs/app-server-protocol/schema/json"

# The distribution is named circle-codex, but the import package keeps the
# upstream name so existing `from openai_codex import ...` code keeps working.
[tool.uv.build-backend]
module-name = "openai_codex"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
required-version = ">=0.15.8"
line-length = 100
extend-exclude = [
  "notebooks/**",
  "src/openai_codex/generated/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = ["E501"]
preview = true
extend-safe-fixes = ["ALL"]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]
"tests/test_real_app_server_integration.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { circle-codex-cli-bin = "2100-01-01T00:00:00Z" }
index-strategy = "first-index"

[tool.uv.pip]
exclude-newer = "7 days"
exclude-newer-package = { circle-codex-cli-bin = "2100-01-01T00:00:00Z" }
index-strategy = "first-index"
